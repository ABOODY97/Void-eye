[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "void-eye"
version = "2.0.0"
description = "Cross-platform terminal packet sniffer built with Scapy, TLS/QUIC SNI extraction, and smart IP/domain resolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aboody" },
]
keywords = ["network", "sniffer", "scapy", "wireshark", "dns", "tls", "quic", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.6.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "colorama>=0.4.6",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-colorama>=0.4.15",
]

[project.scripts]
void-eye = "void_eye:main"

[tool.setuptools]
py-modules = [
    "void_eye",
    "sniffer",
    "ui",
    "resolver",
    "i18n",
    "arabic_tools",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "E501",   # Line length handled pragmatically for translation tables
    "S101",   # Allow assert in pytest suites
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = false
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
